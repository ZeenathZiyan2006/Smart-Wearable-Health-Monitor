version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pulseguardian_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseguardian_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulseguardian_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseguardian} -d ${POSTGRES_DB:-pulseguardian_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseguardian_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseguardian_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-pulseguardian}:${POSTGRES_PASSWORD:-pulseguardian_password}@db:5432/${POSTGRES_DB:-pulseguardian_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
  redis_data:
